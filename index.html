<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Licencia de Armas - PRO</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-slate-900 dark:text-gray-100 transition-colors duration-300 min-h-screen p-4 md:p-8 flex flex-col items-center">

  <div id="app" class="w-full max-w-4xl bg-white dark:bg-slate-800 shadow-xl rounded-2xl p-6 border border-gray-200 dark:border-slate-700 mt-2">
    
    <header class="flex justify-between items-center mb-8 border-b border-gray-200 dark:border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 dark:text-white">Licencia de Armas <span class="text-blue-600 dark:text-blue-400">PRO</span></h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Simulador Oficial</p>
      </div>
      
      <button id="theme-toggle" class="p-3 rounded-full bg-gray-200 dark:bg-slate-700 hover:bg-gray-300 dark:hover:bg-slate-600 transition focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span id="theme-icon">🌙</span>
      </button>
    </header>

    <main id="main-content">
      <div class="text-center py-10">
        <p class="text-lg text-gray-600 dark:text-gray-300 animate-pulse">Cargando aplicación...</p>
      </div>
    </main>

  </div>

  <script type="module" src="/src/main.js"></script>

</html>
